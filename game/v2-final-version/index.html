<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's That Pokemon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="background-animation"></div>

    <main id="landing">
        <h1 class="staggered-title">
            <span class="word">Who's</span>
            <span class="word">That</span>
            <span class="word">Pokémon?</span>
        </h1>
        <p>How many can you get correct?</p>
        <button id="start-btn">Start Game!</button>
    </main>

    <section id="game" class="hidden">
        <header>
            <span id="round">1/10</span>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <span id="score">0 points</span>

            <div id="sound-controls">
                <button id="mute-btn">🔊</button>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5">
            </div>

            <audio id="bg-music" src="audio/theme.mp3" loop></audio>
            <audio id="intro-voice" src="audio/whos_that_pokemon.mp3"></audio>
            <audio id="correct-sfx" src="audio/correct.mp3"></audio>
            <audio id="wrong-sfx" src="audio/wrong.mp3"></audio>
            <audio id="reveal-voice" src="audio/reveal_squirtle.mp3"></audio>
        </header>

        <section>
            <div>
                <h2>Who's that <br> <span>Pokemon</span> <br> ?</h2>
            </div>

            <figure>
                <img id="pokemon-image" src="images/pikachu_s.svg" alt="mysterious pokemon silhouette" width="400"
                    height="400">
                <span></span>
                <span></span>
                <span></span>
            </figure>
        </section>

        <footer>
            <button class="choice-btn">Pikachu</button>
            <button class="choice-btn">Charmander</button>
            <button class="choice-btn">Eevee</button>
            <button class="choice-btn">Snorlax</button>
        </footer>
    </section>

    <section id="results-screen" class="hidden">
        <h1>Game Over!</h1>
        <p>You scored <span id="final-score">0</span> out of 10</p>

        <div id="pokemon-roster-grid"></div>

        <button id="restart-btn">Play Again</button>
        <a href="sources.html">Sources</a>
    </section>

    <div id="feedback-overlay" class="hidden">
        <div class="feedback-content">
            <h2 id="feedback-text">That's Correct!</h2>
            <h3 id="it-was-text">It's Pikachu!</h3>
        </div>
    </div>


</body>

</html>
